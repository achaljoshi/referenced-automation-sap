# ============================================================================
# cucumber-junit-platform-engine configuration for this repo's own
# self-verification suite (src/test). Consuming projects that import this
# jar will have their own junit-platform.properties with their own feature
# location and an extended glue path - see README.md "Using this as a
# dependency".
# ============================================================================

# Where to find step definitions and hooks.
#  - com.company.automation.sap.hooks    ships in this jar: FioriHooks (@fiori-scoped
#                                         Playwright lifecycle) and SapGuiHooks
#                                         (@gui-scoped SAP GUI Scripting session lifecycle).
#  - com.company.automation.sap.stepdefinitions   this repo's own demo glue.
#
# Deliberately NOT com.company.automation.hooks (referenced-automation-ui's
# own untagged Hooks) - wiring that in as well would launch a Playwright
# browser for every scenario, including pure @gui ones that never touch it.
# See FioriHooks's Javadoc.
cucumber.glue=com.company.automation.sap.hooks,com.company.automation.sap.stepdefinitions

# Plugin chain - StepLoggerPlugin/ExtentCucumberAdapter/AllureCucumber7Jvm are
# reused directly from referenced-automation-ui (transitive dependency, same
# classes, same config files - extent.properties/allure.properties/
# extent-spark-config.xml/log4j2.xml all come from the ui jar unmodified).
cucumber.plugin=pretty, \
  summary, \
  json:target/cucumber-reports/cucumber.json, \
  junit:target/cucumber-reports/cucumber.xml, \
  rerun:target/cucumber-reports/rerun.txt, \
  com.company.automation.reporting.StepLoggerPlugin, \
  com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:, \
  io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm

cucumber.publish.quiet=true

# ----------------------------------------------------------------------------
# Parallel execution - OFF by default, unlike referenced-automation-ui/-api.
# Fiori/@fiori scenarios alone would be just as safe to parallelise as ui's
# own suite (one Playwright Browser/Context/Page per thread via
# PlaywrightManager). But this repo also has @gui scenarios that, by design,
# ATTACH to one specific already-open SAP GUI connection/session index -
# running those concurrently risks two threads driving the same native SAP
# GUI session at once, which is unsafe. Since a single junit-platform.properties
# applies to every scenario regardless of tag, the conservative default here
# is sequential execution; a Fiori-only consuming project can safely turn
# parallel execution back on for its own glue path.
# ----------------------------------------------------------------------------
cucumber.execution.parallel.enabled=false

# ----------------------------------------------------------------------------
# Retry logic - identical rerun-file pattern to the rest of this framework
# family (see referenced-automation-ui's junit-platform.properties for the
# full rationale). Only ever relevant to @fiori scenarios in CI, since @gui
# is excluded there by default.
# ----------------------------------------------------------------------------
