# ============================================================================
# Classic SAP GUI Scripting configuration - read by
# com.company.automation.sap.config.SapGuiConfig.
#
# Deliberately NOT named config/config.properties: referenced-automation-ui
# (a compile dependency of this repo) already ships a resource at that exact
# classpath path for the Fiori/UI5 side (browser/viewport/base.url/etc, read
# by com.company.automation.config.ConfigReader, reused here unmodified).
# Two dependency jars shipping a resource at the identical classpath path is
# a real, easy-to-hit problem - whichever the classloader happens to resolve
# first silently wins - so this file lives at its own unique path instead.
#
# Every key below has a coded-in default in SapGuiConfig - this file is
# shipped mainly as a discoverable, documented template. A consuming project
# overrides any key the same three ways the rest of this framework family
# does: a -D system property, an OS env var (upper-cased, dots -> underscores,
# e.g. SAP_GUI_ATTACH_EXISTING), or its own sap/sap-gui.properties higher on
# the classpath.
# ============================================================================

# true (default, recommended) = attach to an already-open, interactive SAP
# Logon connection/session - this framework never opens or closes a real SAP
# connection unless you explicitly opt out below. false = open a brand new
# named connection (sap.gui.connection.name) instead of attaching.
sap.gui.attach.existing=true

# Only used when sap.gui.attach.existing=true. Index into
# GuiApplication.Children / GuiConnection.Children - 0 is "the first open
# connection/session", which is correct for the common case of one SAP Logon
# window with one open session.
sap.gui.connection.index=0
sap.gui.session.index=0

# Only used when sap.gui.attach.existing=false - must match a connection
# entry already configured in your local SAP Logon pad (saplogon.ini).
sap.gui.connection.name=

# When true, SapGuiHooks calls SapGuiSession.close() after every @gui
# scenario. Off by default - see SapGuiSession.close()'s Javadoc for why
# automatically closing a shared/interactive session is not safe to assume.
sap.gui.close.session.after.test=false
