# ============================================================================
# GitLab CI pipeline for the Referenced Automation SAP Framework.
#
# Only the @fiori (Playwright/SAPUI5) side of this repo runs in CI - classic
# SAP GUI Scripting (@gui) needs a real Windows machine with SAP GUI for
# Windows installed, JACOB's native DLL, and a live SAP backend to attach to,
# none of which this (or any) hosted Linux runner has. cucumber.filter.tags
# is set to "not @gui" both as a pom.xml default and explicitly below, for
# safety. See README "Classic SAP GUI Scripting setup" for how to run @gui
# manually on a suitably equipped Windows machine.
#
# Stages:
#   dependencies - build+install referenced-automation-ui AND
#                  referenced-automation-utils locally (see note below)
#   build        - compile the framework + sample suite
#   test         - run @fiori Cucumber scenarios headless, retry only what failed
#   report       - publish Cucumber/Extent/Allure artifacts (always, even on failure)
#   deploy       - `mvn deploy` the framework jar to Nexus (main branch / tags only)
#
# NOTE on the "dependencies" stage: this framework depends on
# referenced-automation-ui AND referenced-automation-utils, neither of which
# is yet published to this org's Nexus. Until they are, this stage clones and
# `mvn install`s both into the shared .m2 cache so `test`/`deploy` can
# resolve them like any other dependency. Once both are published to Nexus,
# delete this stage - the versions already pinned in pom.xml will simply
# resolve from Nexus instead.
# ============================================================================

image: maven:3.9-eclipse-temurin-17

stages:
  - dependencies
  - build
  - test
  - report
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -ntp"
  RERUN_FILE: "target/cucumber-reports/rerun.txt"
  UI_REPO_URL: "https://github.com/achaljoshi/referenced-automation-ui.git"
  UTILS_REPO_URL: "https://github.com/achaljoshi/referenced-automation-utils.git"
  # Keep Playwright's downloaded browser binaries inside the project dir so
  # the GitLab cache below can persist them across pipeline runs.
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"

cache:
  key: "$CI_COMMIT_REF_SLUG-m2-playwright"
  paths:
    - .m2/repository
    - .cache/ms-playwright

install-dependencies:
  stage: dependencies
  script:
    - git clone --depth 1 "$UTILS_REPO_URL" /tmp/referenced-automation-utils
    - cd /tmp/referenced-automation-utils && ./mvnw $MAVEN_CLI_OPTS -DskipTests install && cd -
    - git clone --depth 1 "$UI_REPO_URL" /tmp/referenced-automation-ui
    - cd /tmp/referenced-automation-ui && ./mvnw $MAVEN_CLI_OPTS -DskipTests install && cd -

build:
  stage: build
  needs: ["install-dependencies"]
  script:
    - ./mvnw $MAVEN_CLI_OPTS clean compile test-compile
  artifacts:
    paths:
      - target/classes
      - target/test-classes
    expire_in: 1 hour

.playwright_setup: &playwright_setup
  - ./mvnw $MAVEN_CLI_OPTS exec:java@install-playwright-browsers

test:
  stage: test
  needs: ["build"]
  before_script:
    - *playwright_setup
  script:
    - rm -f "$RERUN_FILE"
    - ./mvnw $MAVEN_CLI_OPTS test -Dbrowser=chromium -Dheadless=true -Denv=qa -Dcucumber.filter.tags="not @gui" || true
    - |
      if [ -s "$RERUN_FILE" ]; then
        echo "== Retrying failed scenarios =="
        cat "$RERUN_FILE"
        ./mvnw $MAVEN_CLI_OPTS test \
          -Dbrowser=chromium -Dheadless=true -Denv=qa -Dcucumber.filter.tags="not @gui" \
          -Dcucumber.features="@$RERUN_FILE" || true
      fi
    - |
      if [ -s "$RERUN_FILE" ]; then
        echo "Scenarios still failing after retry:"
        cat "$RERUN_FILE"
        exit 1
      fi
      echo "All @fiori scenarios passed (first attempt or after retry). @gui excluded - see README."
  artifacts:
    when: always
    paths:
      - target/cucumber-reports/
      - target/extent-report/
      - target/allure-results/
      - target/screenshots/
      - logs/
    reports:
      junit: target/cucumber-reports/cucumber.xml
    expire_in: 30 days

pages:
  stage: report
  image: node:20-slim
  needs: ["test"]
  script:
    - npm install -g allure-commandline --silent
    - allure generate target/allure-results --clean -o public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:
  stage: deploy
  needs: ["test"]
  script:
    - |
      cat > ci-settings.xml <<EOF
      <settings>
        <servers>
          <server><id>nexus-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASS}</password></server>
          <server><id>nexus-snapshots</id><username>${NEXUS_USER}</username><password>${NEXUS_PASS}</password></server>
        </servers>
      </settings>
      EOF
    - ./mvnw $MAVEN_CLI_OPTS -s ci-settings.xml -DskipTests deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
