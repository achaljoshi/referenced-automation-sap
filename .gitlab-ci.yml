# ============================================================================
# GitLab CI pipeline for referenced-automation-sap.
#
# Triggers on: any push to main (including a merge request being merged),
# every merge request, and manual "Run pipeline" from the GitLab UI - see
# the `workflow:` block below.
#
# ---- Restricted-network setup: read this before your first run ----
#
# `mcr.microsoft.com` and the public npm registry are not reachable from
# this network - every image and package this pipeline needs has to come
# from your org's JFrog Artifactory instead. Two CI/CD variables make that
# work (Settings > CI/CD > Variables in this project, or set at group
# level so every repo in the family shares them):
#
#   NPM_REGISTRY_URL            Your Artifactory npm registry URL (the same
#                                one already configured in your local
#                                ~/.npmrc / npm config - this pipeline never
#                                hardcodes it, just reads it from the
#                                variable). If unset, `npm ci` falls back to
#                                npm's normal default registry, which will
#                                fail here - so this one is effectively
#                                required.
#   PLAYWRIGHT_DOWNLOAD_HOST     Optional. Only set this if your Artifactory
#                                also mirrors Playwright's browser-binary
#                                CDN (a "generic remote repository" pointed
#                                at playwright.azureedge.net, in Artifactory
#                                terms). Leave unset to let Playwright try
#                                its real CDN directly - some networks allow
#                                that one host through even when general
#                                internet access is blocked.
#
# `image:` below is the Playwright Docker image mirrored into this org's
# JFrog Artifactory - confirmed reachable, unlike mcr.microsoft.com. It's
# used only as a Node.js + Ubuntu Jammy base with the OS-level libraries
# browsers need already installed - NOT as the source of the browser
# itself. The version baked into that image (v1.47.0) does not have to
# match this repo's own @playwright/test version (kept at whatever
# package.json already pins, unchanged for CI's sake) - the `test` job
# below runs `npx playwright install chromium` itself, after `npm ci`, to
# fetch a browser binary that actually matches whatever version npm just
# installed - see referenced-automation-ui's .gitlab-ci.yml for the full
# reasoning behind this (repeated in every repo's pipeline so each one is
# self-contained). `--with-deps` is deliberately NOT used, since it also
# apt-get installs OS packages, needing its own network path.
#
# ---- Live external test excluded from the main pipeline ----
#
# features/fiori-cart.feature (@regression @live) drives a real, live SAP-hosted demo
# app (ui5.sap.com) - useful locally to prove byControlId/waitForUI5Ready
# against a real UI5 app, but not something this pipeline can guarantee is
# reachable on a locked-down corporate network. The main `test` job below
# only runs test:smoke (tests/fioriPage.spec.ts, a local fixture, and the
# simulator features - no external network needed). A separate `regression` job
# runs the live-demo scenario with `allow_failure: true`, so a genuine regression is still visible
# without blocking the pipeline on a network path outside this repo's
# control.
#
# ---- Cross-repo dependencies: installed by version ----
#
# The @automation/* packages this repo uses are listed with their versions in package.json and installed by
# `npm ci` from the registry in NPM_REGISTRY_URL, like any other package - nothing is cloned or packed here.
# So every package this repo depends on must be PUBLISHED there at the version package.json asks for
# (README: Publishing a package). To take a newer version, change it in package.json, run `npm install` and
# commit package.json and package-lock.json.
# ============================================================================

image: csg-cst-docker-local.artifactory.alm.corp.hmrc.gov.uk:443/common/microsoft/playwright:v1.47.0-jammy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

stages:
  - build
  - test
  - report

variables:
  npm_config_cache: "${CI_PROJECT_DIR}/.npm-cache"

cache:
  key: "${CI_COMMIT_REF_SLUG}-npm"
  paths:
    - .npm-cache/

before_script:
  - if [ -n "${NPM_REGISTRY_URL:-}" ]; then npm config set registry "$NPM_REGISTRY_URL"; fi
  - if [ -n "${PLAYWRIGHT_DOWNLOAD_HOST:-}" ]; then export PLAYWRIGHT_DOWNLOAD_HOST; fi

build:
  stage: build
  script:
    - npm ci
    - npm run build
    - npm run lint
    # type-checks tests, features' steps and scripts too (the build only compiles src/)
    - npm run typecheck
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

test:
  stage: test
  needs: ["build"]
  script:
    - npm ci
    - npx playwright install chromium
    # Both scripts run `bddgen` first (the Gherkin features only exist as tests after it) and end with
    # scripts/min-executed.js: the job FAILS when fewer tests executed than expected, and prints how many tests were
    # skipped and why - e.g. "skipped 8x: needs a JDK" (tests/gui/javaBridge.spec.ts skips without javac/java: the
    # Java/JACOB bridge helper is then NOT exercised, and this is where the log says so). Put a JDK in the image to run it.
    - npm run test:smoke
    # The SAP GUI framework (VBScript converter, session waiting) against the
    # in-memory simulator - needs no SAP and no Windows, so it runs here.
    - npm run test:framework
    # The sample tests in tests/sapgui (logon, transaction, the worked example 04_example_every_feature) against the same
    # simulator: without this they are only ever skipped in CI and could rot unnoticed. ENV=simulator is set by the script.
    - npm run try:simulator
  artifacts:
    when: always
    paths:
      - test-results/
      - playwright-report/
      - allure-results/
      - logs/
    reports:
      junit: test-results/junit.xml
    expire_in: 30 days

regression:
  stage: test
  needs: ["build"]
  allow_failure: true
  script:
    - npm ci
    - npx playwright install chromium
    - npm run test:regression
  artifacts:
    when: always
    paths:
      - test-results/
      - allure-results/
    expire_in: 30 days

# ---- Real SAP GUI recordings (manual, Windows runner only) ----
#
# Converted recordings in tests/sapgui drive the real SAP GUI client over COM,
# so they can only run on a Windows machine that has SAP GUI installed and a
# logged-on session (see README > "Setting up a Windows machine"). Nothing
# else in this pipeline can do that, so this job is manual and may fail
# without blocking.
#
# NOT VERIFIED: this repo's author has no access to such a runner. Before
# relying on this job, (1) replace the placeholder tag below with your Windows
# runner's tag, (2) check the shell commands match that runner's shell
# (PowerShell on a default Windows runner), (3) set SAP_USER / SAP_PASSWORD /
# SAP_CLIENT as masked CI variables, (4) run `npm run doctor` there first, and
# (5) make sure the runner can reach NPM_REGISTRY_URL (the utils and ui packages are installed from there by
# version, like everything else). The registry is set in the script below because
# `before_script` is cleared (it is Linux/sh) and the Docker `image` above is
# ignored by a Windows *shell* executor, which is what this job assumes.
sapgui:
  stage: test
  needs: ["build"]
  when: manual
  allow_failure: true
  tags:
    - sap-gui-windows   # PLACEHOLDER - rename to your Windows runner's tag
  before_script: []
  script:
    - if ($env:NPM_REGISTRY_URL) { npm config set registry $env:NPM_REGISTRY_URL }
    - npm ci
    - npm run build
    - npm run doctor
    - npm run test:sapgui
  artifacts:
    when: always
    paths:
      - test-results/
      - allure-results/
      - logs/
    expire_in: 30 days

# ---- Real-SAP conformance (manual or scheduled, Windows runner only) ----
#
# `npm run conformance` (= `sap-gui-doctor --conformance`) runs the transport conformance suite against a REAL SAP GUI:
# the checks every transport must pass, including the NOT_FOUND vs ERROR codes the retry logic depends on. It is the only
# thing that can show the PowerShell bridge (or the Java/JACOB helper) behaves on a real SAP GUI as the simulator
# assumes - every other job in this file runs the framework against its own simulator.
#
# NOT VERIFIED: nobody has run this job. It is a template: the runner tag is a placeholder, it assumes a logged-on SAP Logon
# session on that runner (SAP_GUI_MODE=attach, one worker). `--conformance` alone changes nothing in SAP (the `--write`
# variant, which this job does not use, types into the command field). allow_failure is true until it has produced a
# trusted result; then make it a scheduled nightly (Settings > CI/CD > Schedules) and set allow_failure to false.
sapgui-conformance:
  stage: test
  needs: ["build"]
  allow_failure: true
  tags:
    - sap-gui-windows   # PLACEHOLDER - rename to your Windows runner's tag
  before_script: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - when: manual
  script:
    - if ($env:NPM_REGISTRY_URL) { npm config set registry $env:NPM_REGISTRY_URL }
    - npm ci
    - npm run build
    - npm run doctor
    - npm run conformance
  artifacts:
    when: always
    paths:
      - logs/
    expire_in: 30 days

# ---- Security gates: dependency audit + secret scan ----
#
# automation-audit-gate fails on high/critical advisories unless audit-allowlist.json accepts them - each exception
# has an owner, a reason and an EXPIRY DATE, so an accepted risk is re-decided on purpose. automation-scan-secrets
# fails if a secret is about to be committed (and never prints it). Both ship in @automation/referenced-automation-utils.
# allow_failure is true until this job has run green on your GitLab (the audit needs NPM_REGISTRY_URL to be reachable
# and to support `npm audit`) - then set it to false.
security:
  stage: test
  needs: ["build"]
  allow_failure: true
  script:
    - npm ci
    - npx automation-scan-secrets
    - npx automation-audit-gate --allow-unassigned

# The Allure HTML report: `allure generate` is a Java program, so it needs a JRE on the runner image (the Playwright
# image has none by default). Without one, or with no raw results to turn into a report, this job says so and ends
# without a `public` folder - nothing is published, and the raw allure-results stay in the test jobs' artifacts.
# ---- Fortnightly framework audit (start it by hand: "Run pipeline" is not needed, use this job's play button) ----
#
# The automated part of the audit (docs/governance/AUDIT.md in referenced-automation-utils): waits, skips, assertions,
# traceability, dependencies, governance files, pipeline and documentation consistency. The report is the job's artifact.
# Set AUDIT_RUN_GATES=1 on the pipeline to also run lint, typecheck, test and security inside this job (slow).
audit:
  stage: report
  needs: ["build"]
  when: manual
  allow_failure: true
  script:
    - npm ci
    - npx automation-framework-audit --out audit-reports ${AUDIT_RUN_GATES:+--run}
  artifacts:
    when: always
    paths:
      - audit-reports/
    expire_in: 90 days

pages:
  stage: report
  needs: ["test", "regression"]
  script:
    - |
      if [ -z "$(ls -A allure-results 2>/dev/null)" ]; then
        echo "no allure-results from the test jobs - nothing to publish"; exit 0
      fi
      if ! command -v java >/dev/null 2>&1; then
        echo "Java not found: allure-commandline needs a JRE. Add one to the image to publish the report; skipping."; exit 0
      fi
      npm install -g allure-commandline --silent
      allure generate allure-results --clean -o public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
